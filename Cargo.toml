[package]
name = "openfraud"
version = "0.11.1"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
description = "Self-hosted fraud and abuse engine for SaaS: events in, decisions out, configurable workflows"
repository = "https://github.com/regisandre/openfraud-rs"
readme = "README.md"
keywords = ["fraud", "abuse", "risk", "anti-spam", "self-hosted"]
categories = ["web-programming::http-server", "command-line-utilities"]

[[bin]]
name = "openfraud"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
cel = { version = "=0.15.0", default-features = false, features = ["json", "regex"] }
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.3"
hmac = "0.12"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "rustls-tls"] }
base64 = { version = "0.23", default-features = false, features = ["std"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
regex = "1"
aho-corasick = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
tower = { version = "0.5", default-features = false, features = ["util"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
