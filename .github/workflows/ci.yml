name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Every shipped scenario passes from the command line too
        run: for f in examples/scenarios/*.jsonl; do cargo run -q --locked -- -c openfraud.toml simulate "$f" > /dev/null || exit 1; done

  sdks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: node --test
        working-directory: sdk/typescript
      - run: python -m unittest discover -s tests
        working-directory: sdk/python
      - run: go vet ./... && go test ./...
        working-directory: sdk/go
      - run: node --check sdk/device/device.js && node --check ui/app.js

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: cargo build --locked
      - name: Every SDK against a running server, and a live configuration reload
        run: bash e2e/run.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t openfraud .
      - name: The image starts, writes its configuration and answers
        run: |
          docker run -d --name openfraud -p 8092:8092 -p 127.0.0.1:8093:8093 openfraud
          for i in $(seq 30); do curl -sf http://127.0.0.1:8092/health && break; sleep 2; done
          curl -sf http://127.0.0.1:8092/health | grep -q '"status"'
          curl -sf -o /dev/null http://127.0.0.1:8093/
          docker exec openfraud test -f /data/openfraud.toml
          docker logs openfraud 2>&1 | grep -q "admin token"
